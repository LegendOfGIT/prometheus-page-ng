<nav class="row" *ngIf="showBreadcrumbs">
  <div class="col-12 breadcrumbs">
    <div *ngFor="let navigationId of navigationIds; let ix=index">
      <span *ngIf="ix === 0 && (navigationIds?.length ?? 0) > 2" class="d-md-none">...&nbsp;</span>
      <span *ngIf="ix > 0" class="{{breadcrumbItemModifier}}">&raquo;&nbsp;</span>
      <a
        (click)="navigateToCategory(navigationId, $event)"
        href="{{getUriOfNavigationId(navigationId)}}"
        class="breadcrumbs__item{{breadcrumbItemModifier}} d-md-inline-block"
        [class.d-none]="!(isSecondLastItem(navigationId) || isLastItem(navigationId))"
      >{{ 'NAVIGATION_' + navigationId | translate }}</a>
    </div>
  </div>
</nav>
