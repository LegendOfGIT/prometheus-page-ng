<div class="header__title-container">
  <a href="{{linkUri}}" (click)="navigateToMore($event)">
    <div class="col-12 w-100 d-inline-flex header header__title" *ngIf="headerTitle">
      <div class="col-12 w-100 d-inline-flex pb-2 ps-4 pe-4 pt-3 header header__title" *ngIf="headerTitle">
        {{headerTitle | translate}} <span *ngIf="linkUri" class="ps-3 text-decoration-underline header__more">{{ 'MODERATED_TEASER_MORE' | translate }} &raquo;</span>
      </div>
    </div>
  </a>
</div>

<section #teaserSection class="align-items-center d-flex flex-column flex-wrap p-3 pt-1 information-items information-items__container">
  <ng-container *ngFor="let itemContainer of itemContainers">
    <ng-container *ngIf="itemContainer.items.length && itemContainer.items.length < 2" [ngTemplateOutlet]="item" [ngTemplateOutletContext]="{ item: itemContainer.items[0], cssSuffix: '100' }">
    </ng-container>
    <ng-container *ngIf="itemContainer.items.length >= 2">
      <div>
        <ng-container *ngFor="let itemFromContainer of itemContainer.items" [ngTemplateOutlet]="item" [ngTemplateOutletContext]="{ item: itemFromContainer, cssSuffix: '50-50' }"></ng-container>
      </div>
    </ng-container>
  </ng-container>
</section>

<ng-template #item let-item='item' let-cssSuffix='cssSuffix'>
  <div
    [routerLink]="getItemUrl(item)"
    (click)="pickedInformation(item)"
    role="button"
    class="mb-2 d-flex align-items-center justify-content-center information-items__tile information-items__tile--{{cssSuffix}}"
  >
    <app-item
      *ngIf="item"
      [item]="item"
      [displayMode]="DISPLAY_MODE_TEASER"
      (imageError)="imageLoadingError($event)"
      [class.h-100]="!item?.titleImage"
      [class.w-100]="!item?.titleImage"
    ></app-item>
    <span *ngIf="!item">&nbsp;</span>
  </div>
</ng-template>
