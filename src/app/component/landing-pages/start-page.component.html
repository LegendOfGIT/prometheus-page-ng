<div class="startPage__content">
  <div
    class="w-100 position-absolute startPage__hero"
    [style.background]="'linear-gradient(180deg, rgba(222,89,53,1) 8%, rgba(255,136,0,0.5075280112044818) 88%, rgba(243,244,242,1) 100%)'"
  >
    <div class="parallax">
      <div class="content">
        <h1 class="animate__animated animate__fadeInDown">{{ 'HERO_WEWANNA_SHOP_TITLE' | translate }}</h1>
        <p class="animate__animated animate__fadeInUp animate__delay-1s">{{ 'HERO_WEWANNA_SHOP_SUBTITLE' | translate }}</p>
      </div>
    </div>
  </div>
  <a *ngIf="false" href="{{currentHero?.heroUrl}}">
    <div
      class="w-100 position-absolute startPage__hero"
      [style.background-image]="currentHero?.backgroundImage"
      [style.background-position-x]="currentHero?.backgroundPositionX"
      [style.background-position-y]="currentHero?.backgroundPositionY"
      [style.background-size]="currentHero?.backgroundSize || 'contain'"
    >
      <div
        *ngIf="currentHero?.heroText"
        class="startPage__heroTitle"
        [style.margin-top]="currentHero?.heroTextMarginTop || '10%'"
      >{{currentHero?.heroText || '' | translate}}</div>
    </div>
  </a>

  <div class="container d-flex justify-content-center mt-5 mt-md-0">
    <div class="row">
      <div class="col p-0 p-lg-4">
        <moderated-teaser
          *ngFor="let teaserItem of STARTPAGE_TEASER_ITEMS; let i = index"
          [filters]="teaserItem.filters"
          [hashtags]="teaserItem.hashtags"
          [headerTitle]="teaserItem.headerTitle"
          [linkUri]="teaserItem.linkUri"
          [navigationId]="teaserItem.navigationId"
          [searchPattern]="teaserItem.searchPattern"
          [ssrRendering]="teaserItem.ssrRendering"
          [createdToday]="teaserItem.createdToday"
          [bigImageLeft]="i % 2 === 0"
          [moderatedTeaserMode]="teaserItem.moderatedTeaserMode"
        >
        </moderated-teaser>
      </div>
    </div>
  </div>

  <div class="container pt-3 pb-3">
    <div class="col-12 fst-italic startPage__disclaimer">
      {{ 'PROVISION_DISCLAIMER' | translate }}
    </div>

    <article class="col-12 startPage__seo mt-5 mb-5">
      {{ 'SEO_STARTPAGE_TEASER' | translate }}
    </article>
  </div>
</div>
